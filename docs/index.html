<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Radar — SWE & Quant roles</title>
<style>
  :root{
    --radius:12px; --accent:#4f8cff; --accent-soft:rgba(79,140,255,.14);
    --new:#16c784; --new-soft:rgba(22,199,132,.15); --star:#f5b301;
    --c-internship:#a06bff; --c-internship-bg:rgba(160,107,255,.15);
    --c-new-grad:#ff9f43; --c-new-grad-bg:rgba(255,159,67,.15);
    --c-full-time:#4f8cff; --c-full-time-bg:rgba(79,140,255,.15);
    --c-event:#ff5c8a; --c-event-bg:rgba(255,92,138,.15);
  }
  html[data-theme="dark"]{--bg:#0b0e14;--bg2:#11151d;--panel:#151a23;--panel-h:#1b212c;
    --border:#232a36;--text:#e7ecf3;--muted:#8b95a7;--muted2:#5d6677;--shadow:0 1px 3px rgba(0,0,0,.45);}
  html[data-theme="light"]{--bg:#f5f7fa;--bg2:#eaeef4;--panel:#ffffff;--panel-h:#f1f5f9;
    --border:#e2e7ef;--text:#16202e;--muted:#5e6878;--muted2:#9aa3b2;--shadow:0 1px 3px rgba(20,30,50,.07);}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);
    font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;}
  a{color:inherit;} button{font-family:inherit;}
  ::-webkit-scrollbar{width:9px;height:9px;} ::-webkit-scrollbar-thumb{background:var(--border);border-radius:5px;}

  /* header */
  header{position:sticky;top:0;z-index:60;background:var(--bg);border-bottom:1px solid var(--border);}
  .bar{display:flex;align-items:center;gap:14px;padding:12px 20px;max-width:1320px;margin:0 auto;}
  .brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:17px;white-space:nowrap;}
  .brand .dot{width:10px;height:10px;border-radius:50%;background:var(--new);box-shadow:0 0 0 4px var(--new-soft);animation:pulse 2.5s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  .search{flex:1;position:relative;max-width:560px;}
  .search input{width:100%;background:var(--panel);border:1px solid var(--border);color:var(--text);
    border-radius:10px;padding:10px 12px 10px 38px;font-size:14px;box-shadow:var(--shadow);}
  .search input:focus{outline:none;border-color:var(--accent);}
  .search svg{position:absolute;left:12px;top:11px;opacity:.5;}
  .search kbd{position:absolute;right:10px;top:9px;font-size:11px;color:var(--muted2);
    border:1px solid var(--border);border-radius:5px;padding:1px 6px;background:var(--bg2);}
  .hbtn{background:var(--panel);border:1px solid var(--border);color:var(--text);height:38px;
    border-radius:9px;cursor:pointer;font-size:13px;font-weight:600;padding:0 13px;display:flex;align-items:center;gap:7px;white-space:nowrap;}
  .hbtn:hover{background:var(--panel-h);} .hbtn.act{border-color:var(--star);color:var(--star);}
  .hbtn .b{background:var(--accent-soft);color:var(--accent);border-radius:20px;font-size:11px;padding:1px 7px;font-weight:700;}
  .updated{color:var(--muted);font-size:12px;white-space:nowrap;}
  #filtersBtn{display:none;}

  .tabs{display:flex;gap:3px;padding:0 20px;max-width:1320px;margin:0 auto;overflow-x:auto;}
  .tab{padding:11px 15px;cursor:pointer;color:var(--muted);font-weight:600;font-size:13.5px;
    border-bottom:2px solid transparent;white-space:nowrap;display:flex;gap:7px;align-items:center;}
  .tab:hover{color:var(--text);} .tab.on{color:var(--accent);border-bottom-color:var(--accent);}
  .tab .n{background:var(--bg2);color:var(--muted);border-radius:20px;font-size:11px;padding:1px 7px;font-weight:700;}
  .tab.on .n{background:var(--accent-soft);color:var(--accent);}

  /* layout */
  .layout{display:grid;grid-template-columns:264px 1fr;gap:24px;max-width:1320px;margin:0 auto;padding:20px;align-items:start;}
  aside{position:sticky;top:104px;height:calc(100vh - 124px);overflow-y:auto;overflow-x:hidden;padding-right:6px;}
  .fsec{border-bottom:1px solid var(--border);padding:14px 0;}
  .fsec:first-child{padding-top:0;}
  .fsec>summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;
    font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted2);font-weight:700;}
  .fsec>summary::-webkit-details-marker{display:none;}
  .fsec>summary::after{content:"▾";font-size:10px;opacity:.6;}
  .fsec[open]>summary::after{content:"▴";}
  .fsec .inner{margin-top:11px;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;}
  .chip{background:var(--panel);border:1px solid var(--border);color:var(--muted);border-radius:8px;
    padding:6px 11px;font-size:12.5px;cursor:pointer;user-select:none;text-transform:capitalize;display:flex;gap:6px;align-items:center;}
  .chip:hover{background:var(--panel-h);color:var(--text);} .chip.on{background:var(--accent);border-color:var(--accent);color:#fff;}
  .chip .c{font-size:11px;opacity:.7;}
  .radio{display:flex;flex-direction:column;gap:3px;}
  .radio label{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);cursor:pointer;padding:3px 0;}
  .radio input{accent-color:var(--accent);}
  .finput{width:100%;background:var(--panel);border:1px solid var(--border);color:var(--text);
    border-radius:8px;padding:7px 10px;font-size:13px;margin-bottom:8px;}
  .finput:focus{outline:none;border-color:var(--accent);}
  .scrolllist{max-height:260px;overflow:auto;display:flex;flex-direction:column;gap:1px;
    border:1px solid var(--border);border-radius:9px;padding:5px;}
  .lrow{display:flex;align-items:center;gap:8px;padding:5px 7px;border-radius:6px;cursor:pointer;font-size:12.5px;color:var(--muted);}
  .lrow:hover{background:var(--panel-h);color:var(--text);} .lrow.on{background:var(--accent-soft);color:var(--text);}
  .lrow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;}
  .lrow .cnt{font-size:11px;color:var(--muted2);}

  /* main toolbar */
  .toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px;}
  .count{font-size:13.5px;color:var(--muted);} .count b{color:var(--text);}
  .spacer{flex:1;}
  .sortsel{background:var(--panel);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:7px 10px;font-size:13px;}
  .activebar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;align-items:center;}
  .afilter{background:var(--accent-soft);color:var(--accent);border:1px solid transparent;border-radius:20px;
    font-size:12px;padding:4px 10px;display:flex;align-items:center;gap:6px;}
  .afilter b{font-weight:700;text-transform:capitalize;} .afilter .x{cursor:pointer;font-weight:700;opacity:.8;}
  .clearall{font-size:12px;color:var(--muted);cursor:pointer;text-decoration:underline;}

  .daygroup{margin-bottom:20px;}
  .dayhdr{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;
    margin:0 0 10px;display:flex;align-items:center;gap:10px;}
  .dayhdr .ln{flex:1;height:1px;background:var(--border);}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
    padding:12px 14px;margin-bottom:9px;display:flex;align-items:center;gap:13px;box-shadow:var(--shadow);
    transition:transform .07s,border-color .15s;}
  .card:hover{border-color:var(--accent);transform:translateY(-1px);}
  .avatar{width:38px;height:38px;border-radius:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff;}
  .cbody{flex:1;min-width:0;}
  .ttl{font-weight:600;font-size:14.5px;line-height:1.35;}
  .ttl a{text-decoration:none;} .ttl a:hover{color:var(--accent);}
  .sub{color:var(--muted);font-size:12.5px;margin-top:3px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .sub .co{color:var(--text);font-weight:500;}
  .sub .loc::before{content:"·";margin-right:8px;color:var(--muted2);}
  .tagmini{font-size:10px;color:var(--muted2);background:var(--bg2);padding:2px 6px;border-radius:5px;text-transform:uppercase;}
  .cright{display:flex;align-items:center;gap:11px;flex-shrink:0;}
  .pills{display:flex;gap:6px;align-items:center;}
  .pill{font-size:10px;text-transform:uppercase;letter-spacing:.03em;font-weight:700;padding:3px 8px;border-radius:6px;white-space:nowrap;}
  .pill.cat-internship{background:var(--c-internship-bg);color:var(--c-internship);}
  .pill.cat-new-grad{background:var(--c-new-grad-bg);color:var(--c-new-grad);}
  .pill.cat-full-time{background:var(--c-full-time-bg);color:var(--c-full-time);}
  .pill.cat-event{background:var(--c-event-bg);color:var(--c-event);}
  .pill.newp{background:var(--new);color:#04210f;}
  .when{color:var(--muted2);font-size:11.5px;white-space:nowrap;min-width:54px;text-align:right;}
  .star{cursor:pointer;font-size:17px;line-height:1;color:var(--muted2);user-select:none;background:none;border:none;padding:0;}
  .star.on{color:var(--star);}
  .more{display:block;margin:16px auto;background:var(--panel);border:1px solid var(--border);color:var(--text);
    border-radius:9px;padding:10px 24px;cursor:pointer;font-size:13px;font-weight:600;}
  .more:hover{background:var(--panel-h);border-color:var(--accent);}
  .empty{text-align:center;color:var(--muted);padding:64px 20px;}
  .empty .big{font-size:34px;margin-bottom:8px;}

  .manual{margin-top:30px;border-top:1px solid var(--border);padding-top:16px;}
  .manual summary{cursor:pointer;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;}
  .linkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:9px;margin-top:14px;}
  .linkcard{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:11px 13px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow);}
  .linkcard:hover{border-color:var(--accent);} .linkcard a{text-decoration:none;font-weight:600;font-size:13.5px;}
  .linkcard .lt{color:var(--muted2);font-size:10px;text-transform:uppercase;margin-top:2px;}

  .backdrop{display:none;}
  @media(max-width:860px){
    .layout{grid-template-columns:1fr;}
    #filtersBtn{display:flex;}
    aside{position:fixed;top:0;left:0;bottom:0;width:300px;max-height:none;background:var(--bg);z-index:80;
      padding:18px;transform:translateX(-100%);transition:transform .2s;border-right:1px solid var(--border);box-shadow:0 0 40px rgba(0,0,0,.4);}
    body.filters-open aside{transform:translateX(0);}
    body.filters-open .backdrop{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:75;}
    .search kbd{display:none;}
  }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand"><span class="dot"></span> Job Radar</div>
    <div class="search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="q" type="search" placeholder="Search role, company, location…"><kbd>/</kbd>
    </div>
    <button class="hbtn" id="filtersBtn">☰ Filters</button>
    <button class="hbtn" id="savedBtn">★ Saved <span class="b" id="savedN">0</span></button>
    <span class="updated" id="updated">loading…</span>
    <button class="hbtn" id="theme" title="Toggle theme" style="padding:0 11px">🌙</button>
  </div>
  <div class="tabs" id="tabs"></div>
</header>

<div class="layout">
  <aside id="sidebar">
    <details class="fsec" open><summary>Focus</summary><div class="inner"><div class="chips" id="tagchips"></div></div></details>
    <details class="fsec" open><summary>Role family</summary><div class="inner"><div class="chips" id="rolechips"></div></div></details>
    <details class="fsec" open><summary>Region</summary><div class="inner">
      <div class="chips" id="regionchips" style="margin-bottom:9px"></div>
      <input class="finput" id="locq" placeholder="Filter by city / location…">
    </div></details>
    <details class="fsec"><summary>Posted within</summary><div class="inner"><div class="radio" id="posted">
      <label><input type="radio" name="posted" value="any" checked> Any time</label>
      <label><input type="radio" name="posted" value="1"> Last 24 hours</label>
      <label><input type="radio" name="posted" value="3"> Last 3 days</label>
      <label><input type="radio" name="posted" value="7"> Last 7 days</label>
      <label><input type="radio" name="posted" value="30"> Last 30 days</label>
    </div></div></details>
    <details class="fsec" open><summary>Companies</summary><div class="inner">
      <input class="finput" id="compq" placeholder="Find a company…">
      <div class="scrolllist" id="complist"></div>
    </div></details>
  </aside>
  <div class="backdrop" id="backdrop"></div>

  <main>
    <div class="toolbar">
      <span class="count" id="count"></span>
      <span class="spacer"></span>
      <select class="sortsel" id="sort">
        <option value="first_seen">Newest detected</option>
        <option value="posted">Recently posted</option>
        <option value="company">Company A–Z</option>
        <option value="title">Role A–Z</option>
      </select>
    </div>
    <div class="activebar" id="activebar"></div>
    <div id="list"></div>
  </main>
</div>

<script>
const NEW_HOURS=24;
let DATA={postings:[],links:[]};
let SAVED=new Set(JSON.parse(localStorage.getItem("jr-saved")||"[]"));
let state={cat:"all",tags:new Set(),roles:new Set(),regions:new Set(),locq:"",
  company:null,q:"",posted:"any",sort:"first_seen",saved:false,hideExpired:true,limit:300};

/* ---------- expiry detection ---------- */
const EVENT_RX=/networking event|info session|information session|career fair|hackathon|webinar|open house|tech talk|meet ?up|recruiting event|insight (day|programme|week)|spring week|open day|fireside/i;
const MONTHS={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
function isRealEvent(p){return p.category==="event"&&EVENT_RX.test(p.title||"");}
// parse a PAST, year-qualified date from a title (returns Date or null). Future dates ignored by caller.
function titleDate(t){
  t=t||"";let m;
  m=t.match(/(spring|summer|fall|autumn|winter)\s+(20\d{2})/i);
  if(m){const e={spring:[5,30],summer:[8,30],fall:[11,31],autumn:[11,31],winter:[2,28]}[m[1].toLowerCase()];return new Date(+m[2],e[0],e[1]);}
  m=t.match(/(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?\s+(\d{1,2})(?:st|nd|rd|th)?,?\s+(20\d{2})/i);
  if(m)return new Date(+m[3],MONTHS[m[1].slice(0,3).toLowerCase()],+m[2],23,59);
  m=t.match(/(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?\s+(20\d{2})/i);
  if(m)return new Date(+m[2],MONTHS[m[1].slice(0,3).toLowerCase()]+1,0,23,59); // end of that month
  return null;
}
function isExpired(p){
  const now=Date.now();
  if(p.expires_at){const d=new Date(p.expires_at);if(!isNaN(d)&&d<now)return true;}
  if(isRealEvent(p)){
    const td=titleDate(p.title);
    if(td)return td.getTime()<now;          // known date → expired iff it's in the past
    const ref=new Date(p.posted_at||p.first_seen||0);
    if(!isNaN(ref)&&(now-ref)/864e5>10)return true; // no date → events go stale ~10d after posting
  }
  return false;
}

/* ---------- role family + region classification ---------- */
const ROLE_FAMILIES=[
  ["Quant / Trading",/(?<![a-z])(quant|quantitative|trader|trading|strateg|systematic|market maker|execution)(?![a-z])/i],
  ["ML / AI",/(?<![a-z])(machine learning|deep learning|\bml\b|\bai\b|a\.i\.|nlp|llm|research scientist|applied scientist|research engineer|computer vision|robotics)(?![a-z])/i],
  ["Data",/(?<![a-z])(data engineer|data scientist|data science|data analyst|analytics|\bdata\b)(?![a-z])/i],
  ["Infra / Platform",/(?<![a-z])(infrastructure|platform|\bsre\b|site reliability|devops|distributed|systems|cloud|kernel|compiler|embedded|firmware)(?![a-z])/i],
  ["Security",/(?<![a-z])(security|appsec|cryptograph|cyber)(?![a-z])/i],
  ["Mobile",/(?<![a-z])(\bios\b|android|mobile)(?![a-z])/i],
  ["Software",/(?<![a-z])(software|swe|developer|full[ -]?stack|back[ -]?end|front[ -]?end|programmer|engineer)(?![a-z])/i],
];
function roleFamily(title){for(const[name,rx]of ROLE_FAMILIES)if(rx.test(title||""))return name;return "Other";}
const REGIONS={
  "Remote":/remote|anywhere/i,
  "US":/united states|\bUSA?\b|, ?(CA|NY|TX|PA|IL|MA|WA|NJ|GA|FL|CO|VA|MD|NC|OH|MI|AZ)\b|san francisco|new york|san jose|santa clara|costa mesa|bala cynwyd|mountain view|menlo park|palo alto|dallas|austin|seattle|chicago|boston|washington|bethesda|los angeles|houston|atlanta|miami|denver|jersey city|charlotte/i,
  "UK":/london|united kingdom|\bUK\b|england|cambridge|oxford|bristol|manchester|edinburgh|leeds/i,
  "Europe":/amsterdam|netherlands|paris|france|german|berlin|munich|cologne|zurich|switzerland|geneva|dublin|ireland|milan|italy|madrid|spain|stockholm|sweden|warsaw|poland|vienna|austria|brussels|belgium|lisbon|portugal|copenhagen|denmark|oslo|norway|helsinki|prague/i,
  "India":/india|bengaluru|bangalore|mumbai|gurgaon|gurugram|\bdelhi|hyderabad|pune|chennai|noida|kolkata/i,
  "APAC":/singapore|hong kong|japan|tokyo|shanghai|beijing|shenzhen|sydney|australia|seoul|korea|taiwan|melbourne/i,
  "Middle East":/israel|tel aviv|yokneam|dubai|abu dhabi|riyadh|qatar/i,
};
function regionsOf(loc){const r=[];for(const k in REGIONS)if(REGIONS[k].test(loc||""))r.push(k);return r;}

/* ---------- helpers ---------- */
function esc(s){return(s||"").replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function timeAgo(iso){if(!iso)return"";const d=(Date.now()-new Date(iso))/1000;
  if(d<3600)return Math.max(1,Math.floor(d/60))+"m";if(d<86400)return Math.floor(d/3600)+"h";
  if(d<604800)return Math.floor(d/86400)+"d";return Math.floor(d/604800)+"w";}
function isNew(iso){return iso&&(Date.now()-new Date(iso))/36e5<NEW_HOURS;}
function avatarColor(n){let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))>>>0;return`hsl(${h%360} 55% 48%)`;}
function initials(n){const w=n.replace(/[^A-Za-z0-9 ]/g,"").split(/\s+/).filter(Boolean);
  return((w[0]?.[0]||"")+(w[1]?.[0]||"")).toUpperCase()||n.slice(0,2).toUpperCase();}
function dayBucket(iso){if(!iso)return"Earlier";const d=(Date.now()-new Date(iso))/864e5;
  if(d<1)return"Today";if(d<2)return"Yesterday";if(d<7)return"This week";if(d<30)return"This month";return"Earlier";}
function postedWithin(p,days){const t=p.first_seen;if(!t)return false;return(Date.now()-new Date(t))/864e5<days;}
function saveState(){localStorage.setItem("jr-saved",JSON.stringify([...SAVED]));}

/* enrich postings once */
function enrich(){DATA.postings.forEach(p=>{p._fam=roleFamily(p.title);p._reg=regionsOf(p.location);});}

/* ---------- filtering ---------- */
function filtered(){
  return DATA.postings.filter(p=>{
    if(state.hideExpired&&isExpired(p))return false;
    if(state.saved&&!SAVED.has(p.uid))return false;
    if(state.cat!=="all"&&p.category!==state.cat)return false;
    if(state.tags.size&&!(p.tags||[]).some(t=>state.tags.has(t)))return false;
    if(state.roles.size&&!state.roles.has(p._fam))return false;
    if(state.regions.size&&!p._reg.some(r=>state.regions.has(r)))return false;
    if(state.company&&p.company!==state.company)return false;
    if(state.posted!=="any"&&!postedWithin(p,+state.posted))return false;
    if(state.locq&&!(p.location||"").toLowerCase().includes(state.locq))return false;
    if(state.q){const h=(p.title+" "+p.company+" "+(p.location||"")).toLowerCase();if(!h.includes(state.q))return false;}
    return true;
  });
}
function sortRows(r){
  if(state.sort==="company")r.sort((a,b)=>a.company.localeCompare(b.company)||(b.first_seen||"").localeCompare(a.first_seen||""));
  else if(state.sort==="title")r.sort((a,b)=>a.title.localeCompare(b.title));
  else if(state.sort==="posted")r.sort((a,b)=>(b.posted_at||"").localeCompare(a.posted_at||""));
  else r.sort((a,b)=>(b.first_seen||"").localeCompare(a.first_seen||""));
  return r;
}

/* ---------- renderers ---------- */
const CATS=[["all","All roles"],["internship","Internships"],["new-grad","New grad"],["full-time","Full-time"],["event","Events"]];
function renderTabs(){
  const A=DATA.postings.filter(p=>!state.hideExpired||!isExpired(p));
  let html=CATS.map(([k,l])=>{const n=k==="all"?A.length:A.filter(p=>p.category===k).length;
    return`<div class="tab ${state.cat===k?'on':''}" data-c="${k}">${l}<span class="n">${n}</span></div>`;}).join("");
  html+=`<div class="tab ${state.cat==='manual'?'on':''}" data-c="manual" style="margin-left:auto">📋 Manual check<span class="n">${(DATA.links||[]).length}</span></div>`;
  tabs.innerHTML=html;
  tabs.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{state.cat=t.dataset.c;state.limit=300;render();});
}
function chipBox(el,items,sel,onclick){
  el.innerHTML=items.map(([v,c])=>`<span class="chip ${sel.has(v)?'on':''}" data-v="${esc(v)}">${esc(v)}${c!=null?`<span class="c">${c}</span>`:""}</span>`).join("");
  el.querySelectorAll(".chip").forEach(ch=>ch.onclick=()=>{const v=ch.dataset.v;sel.has(v)?sel.delete(v):sel.add(v);state.limit=300;renderFilters();render();});
}
function renderFilters(){
  const tg={},fam={},reg={};
  DATA.postings.forEach(p=>{(p.tags||[]).forEach(t=>tg[t]=(tg[t]||0)+1);fam[p._fam]=(fam[p._fam]||0)+1;p._reg.forEach(r=>reg[r]=(reg[r]||0)+1);});
  (DATA.links||[]).forEach(l=>{(l.tags||[]).forEach(t=>tg[t]=(tg[t]||0)+1);if(l.region)reg[l.region]=(reg[l.region]||0)+1;});
  chipBox(tagchips,Object.keys(tg).sort().map(t=>[t,tg[t]]),state.tags);
  chipBox(rolechips,Object.entries(fam).sort((a,b)=>b[1]-a[1]).map(([k,v])=>[k,v]),state.roles);
  chipBox(regionchips,Object.entries(reg).sort((a,b)=>b[1]-a[1]).map(([k,v])=>[k,v]),state.regions);
  renderCompanies();
}
function renderCompanies(){
  const base=DATA.postings.filter(p=>(!state.tags.size||(p.tags||[]).some(t=>state.tags.has(t)))&&(!state.regions.size||p._reg.some(r=>state.regions.has(r)))&&(!state.roles.size||state.roles.has(p._fam)));
  const cnt={};base.forEach(p=>cnt[p.company]=(cnt[p.company]||0)+1);
  const q=compq.value.toLowerCase();
  let names=Object.keys(cnt).filter(n=>n.toLowerCase().includes(q)).sort((a,b)=>cnt[b]-cnt[a]);
  complist.innerHTML=`<div class="lrow ${!state.company?'on':''}" data-co=""><span class="nm">All companies</span><span class="cnt">${base.length}</span></div>`+
    names.map(n=>`<div class="lrow ${state.company===n?'on':''}" data-co="${esc(n)}"><span class="nm">${esc(n)}</span><span class="cnt">${cnt[n]}</span></div>`).join("");
  complist.querySelectorAll(".lrow").forEach(r=>r.onclick=()=>{state.company=r.dataset.co||null;state.limit=300;renderCompanies();render();});
}
function renderActive(){
  const items=[];
  const add=(label,val,clear)=>items.push(`<span class="afilter" data-k="${val}"><b>${esc(label)}</b><span class="x" data-clear="${clear}">✕</span></span>`);
  if(state.cat!=="all")add(CATS.find(c=>c[0]===state.cat)[1],"",`cat`);
  state.tags.forEach(t=>add(t,"",`tag:${t}`));
  state.roles.forEach(r=>add(r,"",`role:${r}`));
  state.regions.forEach(r=>add(r,"",`region:${r}`));
  if(state.company)add(state.company,"",`company`);
  if(state.posted!=="any")add("≤ "+state.posted+"d","",`posted`);
  if(state.locq)add('"'+state.locq+'"',"",`locq`);
  if(state.q)add('search: '+state.q,"",`q`);
  if(state.saved)add("★ Saved only","",`saved`);
  activebar.innerHTML=items.length?items.join("")+`<span class="clearall" id="clearall">Clear all</span>`:"";
  activebar.querySelectorAll(".x").forEach(x=>x.onclick=()=>{
    const c=x.dataset.clear;
    if(c==="cat")state.cat="all";else if(c==="company")state.company=null;else if(c==="posted"){state.posted="any";document.querySelector('input[name=posted][value=any]').checked=true;}
    else if(c==="locq"){state.locq="";locq.value="";}else if(c==="q"){state.q="";q.value="";}else if(c==="saved"){state.saved=false;syncSaved();}
    else if(c.startsWith("tag:"))state.tags.delete(c.slice(4));
    else if(c.startsWith("role:"))state.roles.delete(c.slice(5));
    else if(c.startsWith("region:"))state.regions.delete(c.slice(7));
    state.limit=300;renderFilters();render();
  });
  const ca=document.getElementById("clearall");if(ca)ca.onclick=clearAll;
}
function clearAll(){state.cat="all";state.tags.clear();state.roles.clear();state.regions.clear();state.company=null;
  state.posted="any";state.locq="";state.q="";state.saved=false;state.limit=300;
  q.value="";locq.value="";compq.value="";document.querySelector('input[name=posted][value=any]').checked=true;syncSaved();renderFilters();render();}

function cardHTML(p){
  const fresh=isNew(p.first_seen);const sv=SAVED.has(p.uid);
  const tags=(p.tags||[]).slice(0,3).map(t=>`<span class="tagmini">${t}</span>`).join("");
  return`<div class="card">
    <div class="avatar" style="background:${avatarColor(p.company)}">${initials(p.company)}</div>
    <div class="cbody">
      <div class="ttl"><a href="${p.url}" target="_blank" rel="noopener">${esc(p.title)}</a></div>
      <div class="sub"><span class="co">${esc(p.company)}</span>${p.location?`<span class="loc">${esc(p.location)}</span>`:""} ${tags}</div>
    </div>
    <div class="cright">
      <div class="pills">${fresh?'<span class="pill newp">NEW</span>':''}<span class="pill cat-${p.category}">${p.category.replace("-"," ")}</span></div>
      <span class="when">${timeAgo(p.first_seen)}</span>
      <button class="star ${sv?'on':''}" data-uid="${esc(p.uid)}" title="Save">${sv?'★':'☆'}</button>
    </div>
  </div>`;
}
function render(){
  renderTabs();
  if(state.cat==="manual"){renderManual();return;}
  renderActive();
  let rows=sortRows(filtered());const total=rows.length,newN=rows.filter(p=>isNew(p.first_seen)).length;
  const exp=state.hideExpired?DATA.postings.filter(isExpired).length:0;
  count.innerHTML=`<b>${total.toLocaleString()}</b> roles · <b style="color:var(--new)">${newN}</b> new in last ${NEW_HOURS}h`+
    (exp?` · <span style="color:var(--muted2)">${exp} expired hidden</span>`:"");
  const shown=rows.slice(0,state.limit);
  if(!shown.length){list.innerHTML=`<div class="empty"><div class="big">🔍</div>No roles match these filters.<br><span class="clearall" onclick="clearAllGlobal()">Clear all filters</span></div>`;return;}
  let html="";
  if(state.sort==="first_seen"){
    const order=["Today","Yesterday","This week","This month","Earlier"],bk={};
    shown.forEach(p=>{(bk[dayBucket(p.first_seen)]||=[]).push(p);});
    for(const b of order)if(bk[b])html+=`<div class="daygroup"><div class="dayhdr">${b}<span class="ln"></span>${bk[b].length}</div>${bk[b].map(cardHTML).join("")}</div>`;
  }else html=shown.map(cardHTML).join("");
  list.innerHTML=html;
  if(total>state.limit){const b=document.createElement("button");b.className="more";b.textContent=`Show more (${(total-state.limit).toLocaleString()} remaining)`;b.onclick=()=>{state.limit+=300;render();};list.appendChild(b);}
  list.querySelectorAll(".star").forEach(s=>s.onclick=()=>{const u=s.dataset.uid;SAVED.has(u)?SAVED.delete(u):SAVED.add(u);saveState();syncSaved();render();});
}
function syncSaved(){savedN.textContent=SAVED.size;savedBtn.classList.toggle("act",state.saved);}
function renderManual(){
  let links=(DATA.links||[]);
  if(state.tags.size)links=links.filter(l=>(l.tags||[]).some(t=>state.tags.has(t)));
  if(state.regions.size)links=links.filter(l=>l.region&&state.regions.has(l.region));
  if(state.q)links=links.filter(l=>l.company.toLowerCase().includes(state.q));
  count.innerHTML=`<b>${links.length}</b> companies with no public feed — open these to check manually`;
  activebar.innerHTML="";
  if(!links.length){list.innerHTML=`<div class="empty"><div class="big">📋</div>No companies match.</div>`;return;}
  list.innerHTML=`<div style="color:var(--muted);font-size:12.5px;margin-bottom:14px">These have no auto-pollable public feed — click a card to open a careers search. Use the <b>Focus</b> &amp; <b>Region</b> filters on the left to narrow the list.</div>
  <div class="linkgrid">`+links.sort((a,b)=>a.company.localeCompare(b.company)).map(l=>`<div class="linkcard">
    <div class="avatar" style="background:${avatarColor(l.company)};width:32px;height:32px;font-size:12px">${initials(l.company)}</div>
    <div style="min-width:0"><a href="${l.url}" target="_blank" rel="noopener">${esc(l.company)} ↗</a><div class="lt">${[(l.tags||[]).join(" · "),l.region].filter(Boolean).join("  ·  ")}</div></div></div>`).join("")+`</div>`;
}

/* ---------- events ---------- */
const root=document.documentElement;
(function(){const t=localStorage.getItem("jr-theme")||"dark";root.setAttribute("data-theme",t);theme.textContent=t==="dark"?"🌙":"☀️";})();
theme.onclick=()=>{const t=root.getAttribute("data-theme")==="dark"?"light":"dark";root.setAttribute("data-theme",t);localStorage.setItem("jr-theme",t);theme.textContent=t==="dark"?"🌙":"☀️";};
q.addEventListener("input",e=>{state.q=e.target.value.toLowerCase().trim();state.limit=300;render();});
locq.addEventListener("input",e=>{state.locq=e.target.value.toLowerCase().trim();state.limit=300;render();});
compq.addEventListener("input",renderCompanies);
sort.addEventListener("change",e=>{state.sort=e.target.value;render();});
document.getElementById("posted").addEventListener("change",e=>{state.posted=e.target.value;state.limit=300;render();});
savedBtn.onclick=()=>{state.saved=!state.saved;state.limit=300;syncSaved();render();};
filtersBtn.onclick=()=>document.body.classList.toggle("filters-open");
backdrop.onclick=()=>document.body.classList.remove("filters-open");
window.clearAllGlobal=clearAll;
document.addEventListener("keydown",e=>{if(e.key==="/"&&document.activeElement.tagName!=="INPUT"){e.preventDefault();q.focus();}});

fetch("postings.json?_="+Date.now()).then(r=>r.json()).then(d=>{
  DATA=d;enrich();
  updated.textContent="updated "+timeAgo(d.generated_at)+" ago · "+(d.count||0).toLocaleString()+" live";
  syncSaved();renderFilters();render();
}).catch(()=>{updated.textContent="no data yet";list.innerHTML='<div class="empty"><div class="big">📡</div>No postings.json yet — run <code>python3 poll.py</code> or wait for the first GitHub Action.</div>';});
</script>
</body>
</html>
